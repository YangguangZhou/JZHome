project:
  - name: Caffeine Tracker
    url: https://ct.jerryz.com.cn/
    source: https://github.com/YangguangZhou/Caffeine-Tracker
    problem: 记录咖啡因摄入，并根据代谢模型估算当前含量、变化趋势与适合入睡的时间。
    status: 持续维护
    tech: React · Vite · Capacitor
  - name: TOEFL Speaking Mock System
    url: https://toefl.jerryz.com.cn/
    problem: 按 2026 年托福口语题型提供完整模考、录音转写、评分反馈与历史记录。
    status: 在线运行
    tech: Next.js · TypeScript · OpenAI · Gemini
  - name: Poems
    url: https://poems.jerryz.com.cn/
    source: https://github.com/YangguangZhou/Poems
    problem: 集中整理高中语文必背古诗文，并提供搜索、注释、翻译和背诵练习。
    status: 在线运行
    tech: Next.js · CSS · Vercel
  - name: Monet-All
    url: https://monet.jerryz.com.cn/
    source: https://github.com/YangguangZhou/Monet-All
    problem: 为不同 Android 应用集中提供莫奈动态取色支持，并简化模块的选择与安装。
    status: 稳定版本
    tech: Android · Magisk · Shell
  - name: Cards
    url: https://cards.jerryz.com.cn/
    source: https://github.com/YangguangZhou/Cards
    problem: 让网络身份与个人介绍能够快速生成简洁、统一且便于分享的视觉卡片。
    status: 在线运行
    tech: Web · API · SVG
  - name: Luogu-User-Card
    url: https://api.jerryz.com.cn/
    source: https://github.com/YangguangZhou/Luogu-User-Card
    problem: 将洛谷用户数据整理成易于嵌入主页、博客与 Markdown 的动态信息卡片。
    status: 在线运行
    tech: Web API · JavaScript · Vercel
